<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One Last Surprise ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Poppins,sans-serif;

height:100vh;

overflow:hidden;

background:
radial-gradient(circle at top,#2a145f 0%,#130824 45%,#05010A 100%);

display:flex;

justify-content:center;

align-items:center;

color:white;

}

/* ---------- Sparkles ---------- */

.sparkles{

position:fixed;

inset:0;

pointer-events:none;

overflow:hidden;

}

.spark{

position:absolute;

width:4px;

height:4px;

border-radius:50%;

background:#D4AF37;

opacity:.5;

animation:float 10s linear infinite;

}

@keyframes float{

from{

transform:translateY(100vh);

opacity:0;

}

20%{

opacity:.7;

}

to{

transform:translateY(-120vh);

opacity:0;

}

}

/* ---------- Love Meter ---------- */

#meter{

position:absolute;

top:25px;

right:25px;

padding:12px 18px;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(212,175,55,.25);

backdrop-filter:blur(15px);

font-size:14px;

text-align:center;

display:none;

}

.bar{

margin-top:8px;

height:8px;

width:140px;

background:#222;

border-radius:20px;

overflow:hidden;

}

.fill{

height:100%;

width:0%;

background:linear-gradient(90deg,#F7E7A1,#D4AF37);

transition:width .5s;

}

/* ---------- Main ---------- */

#game{

text-align:center;

padding:20px;

}

h1{

font-family:'Cormorant Garamond',serif;

font-size:54px;

color:#F7E7A1;

margin-bottom:20px;

}

#message{

font-size:19px;

color:#ddd;

margin-bottom:40px;

line-height:1.8;

padding:0 20px;

}

/* ---------- Button ---------- */

#catchBtn{

position:absolute;

left:50%;

top:70%;

transform:translate(-50%,-50%);

padding:16px 35px;

border:none;

border-radius:50px;

font-size:17px;

font-weight:700;

cursor:pointer;

color:#111;

background:

linear-gradient(135deg,#F7E7A1,#D4AF37);

box-shadow:

0 15px 35px rgba(212,175,55,.3);

transition:

left .5s,

top .5s,

transform .3s,

box-shadow .3s;

}

#catchBtn:hover{

box-shadow:

0 20px 45px rgba(212,175,55,.45);

}

/* ---------- Loading ---------- */

#loading{

position:fixed;

inset:0;

background:#05010A;

display:none;

justify-content:center;

align-items:center;

flex-direction:column;

z-index:99;

}

.loader{

width:70px;

height:70px;

border-radius:50%;

border:4px solid rgba(255,255,255,.15);

border-top-color:#D4AF37;

animation:spin 1s linear infinite;

margin-bottom:25px;

}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

#loading p{

font-size:18px;

color:#F7E7A1;

text-align:center;

padding:0 25px;

line-height:1.8;

}

/* ---------- Letter ---------- */

#letter{

display:none;

width:90%;

max-width:450px;

padding:35px;

border-radius:30px;

background:rgba(255,255,255,.05);

backdrop-filter:blur(20px);

border:1px solid rgba(212,175,55,.25);

box-shadow:

0 20px 60px rgba(0,0,0,.5);

animation:fade 1.2s;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

#letter h2{

font-family:'Cormorant Garamond',serif;

font-size:42px;

color:#F7E7A1;

text-align:center;

margin-bottom:25px;

}

#typed{

line-height:2;

font-size:17px;

color:#eee;

min-height:220px;

white-space:pre-wrap;

}

#signature{

margin-top:25px;

text-align:right;

color:#D4AF37;

font-weight:bold;

display:none;

}

/* ---------- Hidden Button ---------- */

#extra{

display:none;

margin-top:30px;

width:100%;

padding:15px;

border:none;

border-radius:40px;

background:transparent;

border:1px solid rgba(212,175,55,.35);

color:#F7E7A1;

font-size:16px;

cursor:pointer;

}

/* ---------- Popup ---------- */

#popup{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.75);

justify-content:center;

align-items:center;

z-index:200;

}

.popup-card{

width:90%;

max-width:350px;

padding:30px;

border-radius:25px;

background:#140B2D;

border:1px solid rgba(212,175,55,.3);

text-align:center;

}

.popup-card h3{

font-size:28px;

color:#F7E7A1;

margin-bottom:15px;

}

.popup-card p{

line-height:1.8;

margin-bottom:25px;

}

.popup-card button{

padding:13px 22px;

margin:8px;

border:none;

border-radius:30px;

font-weight:600;

cursor:pointer;

background:linear-gradient(135deg,#F7E7A1,#D4AF37);

}

</style>

</head>

<body>

<div class="sparkles" id="sparkles"></div>

<div id="meter">

<div>❤️ Love Meter</div>

<div class="bar">

<div class="fill" id="fill"></div>

</div>

<div id="percent">0%</div>

</div>

<div id="game">

<h1>One Last Surprise ✨</h1>

<p id="message">

Tap the button to unlock your surprise ❤️

</p>

</div>

<button id="catchBtn">

Open It ❤️

</button>

<div id="loading">

<div class="loader"></div>

<p>

Loading something made especially for My Nat... ✨

</p>

</div>

<div id="letter">

<h2>Happy Girlfriend's Day 💗</h2>

<p id="typed"></p>

<div id="signature">

Forever Yours,<br>

Aryann 😼

</div>

<button id="extra">

🍎 One More Thing...

</button>

</div>

<div id="popup">

<div class="popup-card">

<h3>🏆 Achievement Unlocked</h3>

<p>

Best Girlfriend Everrrr<br><br>

Successfully caught Aryann.

Now you have to keep him forever. 😔🫶🏻

</p>

<button onclick="finalPopup()">

Deal 🤝

</button>

<button onclick="location.reload()">

No Refunds 🥹

</button>

</div>

</div>
<script>

// ---------- Floating Sparkles ----------

const sparkles = document.getElementById("sparkles");

for(let i=0;i<45;i++){

    let s=document.createElement("div");

    s.className="spark";

    s.style.left=Math.random()*100+"vw";

    s.style.top=Math.random()*100+"vh";

    s.style.animationDuration=(8+Math.random()*8)+"s";

    s.style.animationDelay=Math.random()*5+"s";

    sparkles.appendChild(s);

}

// ---------- Button Game ----------

const btn=document.getElementById("catchBtn");
const msg=document.getElementById("message");

let click=0;

const positions=[
["18%","72%"],
["75%","28%"],
["25%","45%"],
["72%","78%"]
];

const messages=[
"U missed me, my gurlll 🤧",
"Aww... Can't you see me? 🥺",
"Arey 😭 be fast!!",
"Arey ek baar aurrr 😭🫂"
];

btn.onclick=function(){

    if(click<4){

        msg.innerHTML=messages[click];

        btn.style.left=positions[click][0];
        btn.style.top=positions[click][1];

        if(click==2){

            btn.innerHTML="Catch Me 😚";

        }

        if(click==3){

            btn.innerHTML="Promise This Is The Last Time 🥹";

        }

        click++;

    }

    else{

        msg.innerHTML="Hehe... You finally caught me ❤️";

        btn.style.pointerEvents="none";

        btn.style.transform="translate(-50%,-50%) scale(.9)";

        setTimeout(startLoading,1000);

    }

};

// ---------- Loading ----------

function startLoading(){

document.getElementById("game").style.display="none";

btn.style.display="none";

document.getElementById("loading").style.display="flex";

document.getElementById("meter").style.display="block";

animateMeter();

}

// ---------- Love Meter ----------

function animateMeter(){

const fill=document.getElementById("fill");

const percent=document.getElementById("percent");

let value=0;

const timer=setInterval(()=>{

value+=2;

fill.style.width=value+"%";

percent.innerHTML=value+"%";

if(value>=100){

clearInterval(timer);

setTimeout(()=>{

percent.innerHTML="∞ Infinite ❤️";

showLetter();

},800);

}

},40);

}

// ---------- Show Letter ----------

function showLetter(){

document.getElementById("loading").style.display="none";

document.getElementById("letter").style.display="block";

typeLetter();

}

// ---------- Typewriter ----------

const text=`My Dearest Nat,

If you're reading this...

Congratulations.....

You finally caught me😭🖐🏻

But honestly...

You caught my heart long before this button.

Thank you for being my biggest happiness,
my comfort,
my best friend,
and my favourite person.
Haan kabhi kabhi thodaa sa gadbad krr detii ho

Every little moment with you
becomes a memory I'll always treasure.

I don't know what tomorrow brings...

But I do know one thing,

I'll always choose you.

Happy Girlfriend's Day,
My Beautiful Bbg🫶🏻`;

let i=0;

function typeLetter(){

const typed=document.getElementById("typed");

const sign=document.getElementById("signature");

const extra=document.getElementById("extra");

const timer=setInterval(()=>{

typed.innerHTML+=text.charAt(i);

i++;

if(i>=text.length){

clearInterval(timer);

sign.style.display="block";

extra.style.display="block";

}

},35);

}

// ---------- One More Thing ----------

document.getElementById("extra").onclick=function(){

document.getElementById("popup").style.display="flex";

}

// ---------- Final Popup ----------

function finalPopup(){

document.querySelector(".popup-card").innerHTML=`

<h3 style="color:#F7E7A1;">YAYYYY!! 🌷</h3>

<p style="line-height:1.8;">

Mission Successful 💖<br><br>

Aryann is officially yours forever. 🎀♾️<br><br>

Thank you for making my life so beautiful.

Happy Girlfriend's Day, My Nat. 🌸

</p>

<button onclick="location.reload()">

Close ❤️

</button>

`;

}

</script>

</body>
</html>
